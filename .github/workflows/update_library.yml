name: Update Library Data and Post

on:
  schedule:
    # 매주 일요일 19:00 UTC = 한국 시간(KST) 매주 월요일 04:00 AM 실행
    - cron: '0 19 * * 0'
  # GitHub 웹 Actions 탭에서 수동으로 즉시 실행할 수 있는 버튼 추가
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-updater:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: Run library update script
        env:
          DATA4LIBRARY_AUTH_KEY: ${{ secrets.DATA4LIBRARY_AUTH_KEY }}
        run: |
          # 루트 디렉토리에 위치한 파이썬 스크립트 실행
          python fetch_libraries.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "변경 사항이 없어 커밋하지 않습니다."
          else
            git commit -m "chore: 전국 도서관 정보 자동 갱신"
            git push
          fi
